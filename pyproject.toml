[build-system]
requires = ["pbr>=6.1.1"]
build-backend = "pbr.build"

[project]
name = "cursive"
description = "Cursive implements OpenStack-specific validation of digital signatures."
readme = "README.rst"
authors = [
    {name = "OpenStack", email = "openstack-discuss@lists.openstack.org"},
]
license = "Apache-2.0"
requires-python = ">=3.11"
classifiers = [
    "Environment :: OpenStack",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
]
dynamic = ["version", "dependencies"]

[project.urls]
Homepage = "https://docs.openstack.org/cursive"
Repository = "https://opendev.org/openstack/cursive"

[tool.setuptools.packages.find]
include = ["cursive"]

[tool.ruff]
line-length = 79

[tool.ruff.format]
quote-style = "preserve"
docstring-code-format = true

[tool.ruff.lint]
select = ["E4", "E5", "E7", "E9", "F", "G", "LOG", "S", "UP"]
# S105-S107: hardcoded password checks - likely to generate false
#            positives in a gate environment
# S607: start process with a partial path - this should be a project
#       level decision
ignore = ["S105", "S106", "S107", "S607"]

[tool.ruff.lint.per-file-ignores]
"cursive/tests/*" = ["S"]
