[tox]
minversion = 4.28.0
envlist = py3,pep8
skipsdist = True

[testenv]
usedevelop = True
constraints =
  {env:TOX_CONSTRAINTS_FILE:https://releases.openstack.org/constraints/upper/master}
deps =
  -r{toxinidir}/requirements.txt
  -r{toxinidir}/test-requirements.txt
commands =
  stestr run {posargs}
  stestr slowest

[testenv:pep8]
skip_install = True
description =
  Run style checks.
deps =
  pre-commit
commands =
  pre-commit run -a

[testenv:venv]
commands = {posargs}

[testenv:cover]
setenv =
  PYTHON=coverage run --source cursive --parallel-mode
commands =
  stestr run {posargs}
  coverage combine
  coverage html -d cover
  coverage xml -o cover/coverage.xml

[testenv:docs]
deps =
  -r{toxinidir}/doc/requirements.txt
commands =
  rm -fr doc/build/html doc/build/doctrees
  sphinx-build -W -j auto -b html -d doc/build/doctrees doc/source doc/build/html
allowlist_externals = rm

[testenv:releasenotes]
skip_install = True
deps = {[testenv:docs]deps}
commands =
  sphinx-build -a -E -W -d releasenotes/build/doctrees -b html releasenotes/source releasenotes/build/html

[testenv:debug]
commands = oslo_debug_helper {posargs}

[flake8]
show-source = True
# We only enable the hacking (H) checks
select = H
ignore = H301
builtins = _
exclude=.venv,.git,.tox,dist,doc,*lib/python*,*egg,build
